# htpolynet -- Example 6 -- Cyanate-ester-equivalent thermoset (BPA + 1,3,5-triazine)
#
# Topological model of a fully cured bisphenol-A dicyanate (BADCy) thermoset.
# Rather than modelling the real cyclotrimerization (three R-O-C#N groups
# closing into a triazine ring during cure -- which would require 3-way
# in-cure ring closure and careful bondcycle handling), this example uses the
# *product topology* of a cured BADCy network directly:
#
#   - BPA   (A2):  bisphenol-A with two reactive phenolic -OH groups.
#   - TAZ   (B3):  bare 1,3,5-triazine, three reactive aromatic ring C-H sites.
#                  Same triazine ring that forms the crosslink node in real
#                  BADCy after cyclotrimerization -- but pre-formed here, so
#                  every monomer enters the box already carrying its ring.
#
# The single cure reaction forms one BPA-O-C(triazine) aryl ether per event
# (losing one H from BPA's phenol oxygen and one H from a triazine ring C).
# Symmetry-equivalent atoms (BPA's two O's, TAZ's three C's) are declared so
# htpolynet auto-expands the one user-written reaction into all 2*3 = 6
# permutations.  The resulting network has triazine rings as trifunctional
# nodes, BPA bridges as difunctional spacers, and aryl-ether linkages between
# them -- structurally identical to a fully cured BADCy thermoset.
#
# Stoichiometry: 3 BPA x 2 phenolic O = 6 reactive sites per 3 BPA;
#                2 TAZ x 3 ring C    = 6 reactive sites per 2 TAZ.
# So the 3:2 BPA:TAZ ratio below is balanced for full conversion.
#
# Tradeoff vs. example 6's earlier cyclotrimerization model:
#   + No in-cure ring closure; no bondcycle bypass; simple A2+B3 step-growth.
#   + No assembled-monomer param stage (BPA and TAZ are inserted directly).
#   - The cure mechanism here is aryl substitution, not cyclotrimerization,
#     so cure-kinetics and intermediate-species questions can't be addressed
#     with this model.  The final cured-network *structure* is faithful.
#
# Incomplete-cure realism: because cure is deterministic-conversion driven
# (not chemically rate-limited), at finite desired_conversion < 1 the system
# can carry leftover BPA-OH and bare triazine C-H sites -- both unphysical
# in a real BADCy thermoset.  The ``postcure_repair`` block below converts
# those artifacts into chemically-realistic residuals: every incomplete
# triazine (k<3 bonded BPAs) is dismantled into three -C#N fragments which
# are reattached either in place (to the BPAs they were already bonded to)
# or to the nearest free BPA-OH, yielding the BPA-O-C#N end-groups that
# real undercured BADCy actually contains.  Atom conservation is exact.
#
# Run with:
#
#   htpolynet run -diag diagnostics.log 6-cyanate-ester.yaml
#
# Cameron F. Abrams -- cfa22@drexel.edu

Title: Cyanate-ester-equivalent thermoset (BPA + 1,3,5-triazine)
gromacs:
  gmx: gmx
  gmx_options: -quiet -nobackup
  mdrun: gmx mdrun
  mdrun_options:
    gpu_id: 0            # auto-stripped at runtime if gmx is not GPU-capable or no GPU is visible
ambertools:
  charge_method: gas
constituents:
  BPA:
    # Bisphenol-A, two phenolic -OH groups reactive (z=1 each).  Identical
    # to the BPA building block in examples 2 and 6 (prior form).
    smiles: "CC(c1ccc([OH:1])cc1)(c1ccc([OH:2])cc1)C"
    reactive_atoms: {1: O1, 2: O2}
    count: 360
    symmetry_equivalent_atoms: [[O1, O2]]
  TAZ:
    # 1,3,5-triazine (s-triazine): aromatic ring of alternating C and N,
    # three reactive ring C-H sites (z=1 each).  Each C loses its one
    # aromatic H to form an aryl-ether bond with a BPA phenolic O.  The
    # N atoms are mapped to give them distinct names (N1/N2/N3) so the
    # postcure_repair driver can refer to them by name when dismantling
    # incomplete rings.
    smiles: "[cH:1]1[n:4][cH:2][n:5][cH:3][n:6]1"
    reactive_atoms: {1: C1, 2: C2, 3: C3, 4: N1, 5: N2, 6: N3}
    count: 240
    symmetry_equivalent_atoms: [[C1, C2, C3], [N1, N2, N3]]
  CYN:
    # Hydrogen cyanide as the cap-template building block.  Not inserted
    # into the simulation box -- exists only so that the linked-product
    # template ``BPA~O1-C1~CYN`` can be auto-parameterized at setup time
    # for use by the postcure_repair stage (see below).  The C carries
    # z=1 (loses one H to bond with BPA-O); the N is terminal but mapped
    # so it lands in the mol2 as N1 (not the default element-only name);
    # the repair driver looks up cap atoms by name, so both must be unique.
    smiles: "[CH:1]#[N:2]"
    reactive_atoms: {1: C1, 2: N1}
densification:
  initial_density: 200.0  # kg/m3
  equilibration:
    - ensemble: min
    - ensemble: nvt
      temperature: 300
      ps: 10
    - ensemble: npt
      temperature: 300
      pressure: 10
      ps: 100
      repeat: 4
      converge:
        tolerance: 1.0    # kg/m3; stop when the mean density is this well known
        max_repeats: 6    # hitting this is reported as a failure to converge
precure:
  preequilibration:
    ensemble: npt
    temperature: 300        # K
    pressure: 1             # bar
    ps: 200
  anneal:
    ncycles: 2
    initial_temperature: 300
    cycle_segments:
      - T: 300
        ps: 0
      - T: 500
        ps: 20
      - T: 500
        ps: 20
      - T: 300
        ps: 20
      - T: 300
        ps: 20
  postequilibration:
    ensemble: npt
    temperature: 300        # K
    pressure: 1             # bar
    ps: 100
CURE:
  controls:
    search_radius: 0.5          # nm
    radial_increment: 0.25      # nm
    min_bonds_per_iteration: 10
    max_iterations: 150
    desired_conversion: 0.90    # BOND conversion; the cyanate (FTIR) conversion
                                # this yields is lower -- roughly its cube, since
                                # a triazine survives repair only if all three of
                                # its sites filled.  Both numbers are reported at
                                # the end of the repair stage.
    late_threshold: 0.80
    # completion_bias: true     # finish partly-reacted triazines before starting
                                # untouched ones, so desired_conversion means the
                                # cyanate conversion.  Off here so this example
                                # keeps its published behavior.
  drag:
    trigger_distance: 0.6   # nm
    increment: 0.08         # nm
    limit: 0.3              # nm
    equilibration:
      - ensemble: min
      - ensemble: nvt
        temperature: 600
        nsteps: 1000
      - ensemble: npt
        temperature: 600
        pressure: 1
        nsteps: 2000
  relax:
    increment: 0.08         # nm
    equilibration:
      - ensemble: min
      - ensemble: nvt
        temperature: 600
        nsteps: 1000
      - ensemble: npt
        temperature: 600
        pressure: 1
        nsteps: 2000
  equilibrate:
    ensemble: npt
    temperature: 300       # K
    pressure: 1            # bar
    ps: 100
  gromacs:
    rdefault: 0.9          # nm
postcure:
  anneal:
    ncycles: 2
    initial_temperature: 300
    cycle_segments:
      # First segment must have ps=0: gmx requires annealing_time[0] <= init_t,
      # and after this stage's preceding NVT, init_t is 0 by default.
      - T: 300
        ps: 0
      - T: 500
        ps: 20
      - T: 500
        ps: 20
      - T: 300
        ps: 20
      - T: 300
        ps: 20
  postequilibration:
    ensemble: npt
    temperature: 300       # K
    pressure: 1            # bar
    ps: 100
reactions:
  # A2+B3 step-growth: BPA's phenolic O forms an aryl ether with one of the
  # triazine ring carbons, each side losing one H.  The single reaction
  # below is auto-expanded by htpolynet (via symmetry_equivalent_atoms on
  # both monomers) into all 2 x 3 = 6 (O, C) permutations.  htpolynet also
  # builds 18 templates for bonds to rings that already carry one or two
  # BPAs, so later bonds on a ring do not reset the charges of its
  # already-reacted carbons.
  - name: etherify
    stage: cure
    reactants: {1: BPA, 2: TAZ}
    product: BPA~O1-C1~TAZ
    probability: 1.0
    atoms:
      A: {reactant: 1, resid: 1, atom: O1, z: 1}
      B: {reactant: 2, resid: 1, atom: C1, z: 1}
    bonds:
      - atoms: [A, B]
        order: 1
  # Repair-stage template: defines the linked product BPA~O1-C1~CYN used
  # by the postcure_repair driver below.  Never executed as a reaction
  # at runtime -- htpolynet builds + parameterizes the template at setup
  # time, and the repair driver splices its parameters into the system
  # for every BPA-O-C#N cap it forms (in place or transferred).
  - name: cap_with_cyanate
    stage: repair
    reactants: {1: BPA, 2: CYN}
    product: BPA~O1-C1~CYN
    probability: 1.0
    atoms:
      A: {reactant: 1, resid: 1, atom: O1, z: 1}
      B: {reactant: 2, resid: 1, atom: C1, z: 1}
    bonds:
      - atoms: [A, B]
        order: 1
postcure_repair:
  # Convert every incomplete triazine into chemically-realistic BADCy
  # residual species.  Each TAZ ring with fewer than 3 bonded BPAs is
  # dismantled into 3 separate -C#N fragments: those already attached to
  # a BPA become BPA-O-C#N caps in place; the rest are transferred to
  # the nearest unreacted BPA-OH within `cap_search_radius`.  Atom
  # conservation is exact across the system.  Linked-product template
  # `BPA~O1-C1~CYN` (auto-generated from the repair-stage reaction above)
  # supplies the post-repair parameters.
  - type: triazine_to_cyanate_cap
    crosslinker:
      residue: TAZ
      ring_carbon_atoms: [C1, C2, C3]
      ring_nitrogen_atoms: [N1, N2, N3]
      full_bond_count: 3
    bridge:
      residue: BPA
      reactive_oxygen_atoms: [O1, O2]
    cap_residue: CYN
    cap_template: BPA~O1-C1~CYN
    cap_search_radius: 0.6   # nm; expanded up to 10x on miss, falls back to global nearest
