# htpolynet -- Example 6 -- Bisphenol-A dicyanate (BADCy) cured by cyclotrimerization
#
# Cyanate esters cure by cyclotrimerization: three -O-C#N groups close into one
# 1,3,5-triazine ring, an addition in which no atom is lost.  The triazine rings are the
# trifunctional crosslink junctions and the bisphenol-A cores are the bridges between
# them.  This example builds that network by the real chemistry, using the `ring_cure`
# block below in place of CURE's pairwise crosslinking.
#
# One monomer, BDC (N#C-O-C6H4-C(CH3)2-C6H4-O-C#N), carries two cyanate groups.  The
# single reaction `cyclotrimerize` takes three of them and forms three new bonds,
# N1-C2, N2-C3 and N3-C1, which close the ring.  htpolynet builds and parameterizes the
# trimer template once, at setup, and splices it into the system for every ring.
#
# Conversion is counted in cyanate groups consumed -- three per ring -- which is the
# quantity FTIR measures and the literature reports.  A group that never finds two
# partners simply stays -O-C#N, which is what real under-cured BADCy contains, so no
# post-cure repair is needed.
#
# Releases before 2.15.0 built this example with a stand-in model: bisphenol A plus a
# pre-formed 1,3,5-triazine, joined by aryl-ether bonds, with a postcure repair stage
# that dismantled incomplete rings into -O-C#N caps.  Its final connectivity can match
# a cured BADCy network, but its triazine rings exist before cure begins, so the way
# the network forms -- and its gel point -- are not those of the chemistry.
#
# Run with:
#
#   htpolynet run -diag diagnostics.log 6-cyanate-ester.yaml
#
# Cameron F. Abrams -- cfa22@drexel.edu

Title: Bisphenol-A dicyanate cured by cyclotrimerization
gromacs:
  gmx: gmx
  gmx_options: -quiet -nobackup
  mdrun: gmx mdrun
  mdrun_options:
    gpu_id: 0            # auto-stripped at runtime if gmx is not GPU-capable or no GPU is visible
ambertools:
  charge_method: gas
constituents:
  BDC:
    # Bisphenol-A dicyanate.  Each cyanate's C and N are reactive (z=1 each): the C of
    # one group bonds to the N of the next around the ring.  The two groups are
    # symmetry-equivalent, so the one reaction below expands to every combination.
    smiles: "[N:1]#[C:2]Oc1ccc(cc1)C(C)(C)c1ccc(O[C:3]#[N:4])cc1"
    reactive_atoms: {1: N1, 2: C1, 3: C2, 4: N2}
    symmetry_equivalent_atoms: [[C1, C2], [N1, N2]]
    count: 360
densification:
  initial_density: 200.0  # kg/m3
  equilibration:
    - ensemble: min
    - ensemble: nvt
      temperature: 300
      ps: 10
    - ensemble: npt
      temperature: 300
      pressure: 10
      ps: 100
      repeat: 4
      converge:
        tolerance: 1.0    # kg/m3; stop when the mean density is this well known
        max_repeats: 6    # hitting this is reported as a failure to converge
precure:
  preequilibration:
    ensemble: npt
    temperature: 300        # K
    pressure: 1             # bar
    ps: 200
  anneal:
    ncycles: 2
    initial_temperature: 300
    cycle_segments:
      - T: 300
        ps: 0
      - T: 500
        ps: 20
      - T: 500
        ps: 20
      - T: 300
        ps: 20
      - T: 300
        ps: 20
  postequilibration:
    ensemble: npt
    temperature: 300        # K
    pressure: 1             # bar
    ps: 100
ring_cure:
  search_radius: 0.5        # nm; longest new bond a candidate ring may need
  radial_increment: 0.05    # nm; widen the search by this when an iteration is short of rings
  desired_conversion: 0.97  # fraction of cyanate GROUPS consumed, three per ring
  max_iterations: 150
  closure:
    nstages: 6              # restraint stages that pull each candidate ring shut
  # Every other ring_cure setting is left at its default.  Two are worth knowing:
  #   reject_threaded_rings, reject_new_threading (both true) decline a ring that would
  #   close around an existing bond, or that leaves a dragged monomer's bond threading an
  #   existing ring.  A threaded ring is permanent -- no later relaxation can undo it --
  #   so it is refused rather than repaired.  `htpolynet piercings` counts any that remain.
  # Each iteration then relaxes at 600 K and re-equilibrates at 300 K and 1 bar, as CURE
  # does, and the cure settles the network once on exit.
  #
  # Fang & Shimp's end-group arithmetic caps acyclic growth at 75% cyanate conversion,
  # so a network that reaches 0.97 necessarily contains macrocycles.  That is the real
  # chemistry, and it is why no cycle-length filter is applied here.
postcure:
  anneal:
    ncycles: 2
    initial_temperature: 300
    cycle_segments:
      # First segment must have ps=0: gmx requires annealing_time[0] <= init_t,
      # and after this stage's preceding NVT, init_t is 0 by default.
      - T: 300
        ps: 0
      - T: 500
        ps: 20
      - T: 500
        ps: 20
      - T: 300
        ps: 20
      - T: 300
        ps: 20
  postequilibration:
    ensemble: npt
    temperature: 300       # K
    pressure: 1            # bar
    ps: 100
reactions:
  - name: cyclotrimerize
    stage: cure
    reactants: {1: BDC, 2: BDC, 3: BDC}
    product: BDC3
    probability: 1.0
    atoms:
      N1: {reactant: 1, resid: 1, atom: N1, z: 1}
      C1: {reactant: 1, resid: 1, atom: C1, z: 1}
      N2: {reactant: 2, resid: 1, atom: N1, z: 1}
      C2: {reactant: 2, resid: 1, atom: C1, z: 1}
      N3: {reactant: 3, resid: 1, atom: N1, z: 1}
      C3: {reactant: 3, resid: 1, atom: C1, z: 1}
    bonds:
      # An addition: no hydrogen is lost, so no sacrificial H.
      - atoms: [N1, C2]
        order: 1
        sacrificial_h: false
      - atoms: [N2, C3]
        order: 1
        sacrificial_h: false
      - atoms: [N3, C1]
        order: 1
        sacrificial_h: false
