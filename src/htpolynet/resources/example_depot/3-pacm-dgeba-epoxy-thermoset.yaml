# htpolynet -- Example 3 -- PACM/DGEBA Epoxy Thermoset
#
# Self-contained config: DGE (DGEBA, the active form of bisphenol-A diglycidyl
# ether) and PAC (PACM, 4,4'-methylenebis(cyclohexylamine)) are generated from
# SMILES via the RDKit atom-mapping path.  Run with:
#
#   htpolynet run -diag diagnostics.log 3-pacm-dgeba-epoxy-thermoset.yaml
#
# Cameron F. Abrams -- cfa22@drexel.edu

Title: DGEBA-PACM thermoset
gromacs:
  gmx: gmx
  gmx_options: -quiet -nobackup
  mdrun: gmx mdrun
  mdrun_options:
    gpu_id: 0            # auto-stripped at runtime if gmx is not GPU-capable or no GPU is visible
ambertools:
  charge_method: gas
constituents:
  DGE:
    smiles: "CC(C)(c1ccc(OC[CH:3]([OH:5])[CH3:1])cc1)c1ccc(OC[CH:4]([OH:6])[CH3:2])cc1"
    reactive_atoms: {1: C1, 2: C2, 3: C3, 4: C4, 5: O1, 6: O2}
    count: 1600
    symmetry_equivalent_atoms: [[C1, C2], [C3, C4], [O1, O2]]
    stereocenters: [C3]
  PAC:
    # Both amine carbons named C1 and both nitrogens named N1 -- the
    # symmetry_equivalent_atoms entry below tells htpolynet to treat the
    # second copies as C2 / N2.
    smiles: "C1C[CH:1](CCC1CC2CC[CH:2](CC2)[NH2:3])[NH2:4]"
    reactive_atoms: {1: C1, 2: C1, 3: N1, 4: N1}
    count: 800
    symmetry_equivalent_atoms: [[N1, N2], [C1, C2]]
    stereocenters: [C1]
densification:
  initial_density: 300.0  # kg/m3
  equilibration:
    - ensemble: min
    - ensemble: nvt
      temperature: 300
      ps: 10
    - ensemble: npt
      temperature: 300
      pressure: 10
      ps: 300
      converge:
        tolerance: 1.0    # kg/m3; stop when the mean density is this well known
        max_repeats: 6    # hitting this is reported as a failure to converge
precure:
  preequilibration:
    ensemble: npt
    temperature: 300        # K
    pressure: 1             # bar
    ps: 200
  anneal:
    ncycles: 2
    initial_temperature: 300
    cycle_segments:
      - T: 300
        ps: 0
      - T: 600
        ps: 20
      - T: 600
        ps: 20
      - T: 300
        ps: 20
      - T: 300
        ps: 20
  postequilibration:
    ensemble: npt
    temperature: 300        # K
    pressure: 1             # bar
    ps: 100
CURE:
  controls:
    search_radius: 0.5  # nm
    radial_increment: 0.25      # nm
    max_iterations: 150
    desired_conversion: 0.95
    late_threshold: 0.85
  drag:
    trigger_distance: 0.6   # nm
    increment: 0.08         # nm
    limit: 0.3              # nm
    equilibration:
      - ensemble: min
      - ensemble: nvt
        temperature: 600
        nsteps: 1000
      - ensemble: npt
        temperature: 600
        pressure: 1
        nsteps: 2000
  relax:
    increment: 0.08         # nm
    equilibration:
      - ensemble: min
      - ensemble: nvt
        temperature: 600
        nsteps: 1000
      - ensemble: npt
        temperature: 600
        pressure: 1
        nsteps: 2000
  equilibrate:
    ensemble: npt
    temperature: 300       # K
    pressure: 1            # bar
    ps: 100
  gromacs:
    rdefault: 0.9          # nm
postcure:
  anneal:
    ncycles: 2
    initial_temperature: 300
    cycle_segments:
      - T: 300
        ps: 0
      - T: 600
        ps: 20
      - T: 600
        ps: 20
      - T: 300
        ps: 20
      - T: 300
        ps: 20
  postequilibration:
    ensemble: npt
    temperature: 300       # K
    pressure: 1            # bar
    ps: 100
reactions:
  - name:        'Primary-to-secondary-amine'
    stage:       cure
    reactants:
      1: PAC
      2: DGE
    product:     PAC~N1-C1~DGE
    probability: 1.0
    atoms:
      A:
        reactant: 1
        resid: 1
        atom: N1
        z: 2
      B:
        reactant: 2
        resid: 1
        atom: C1
        z: 1
    bonds:
      - atoms: [A, B]
        order: 1
  - name:        'Secondary-to-tertiary-amine'
    reactants:
      1: PAC~N1-C1~DGE
      2: DGE
    product:     PAC~N1-C1~DGE-C1~DGE
    stage:       cure
    probability: 0.5
    atoms:
      A:
        reactant: 1
        resid: 1
        atom: N1
        z: 1
      B:
        reactant: 2
        resid: 1
        atom: C1
        z: 1
    bonds:
      - atoms: [A, B]
        order: 1
  - name:        'Oxirane-formation'
    reactants:
      1: DGE
    product:     DGEC
    stage:       cap
    probability: 1.0
    atoms:
      A:
        reactant: 1
        resid: 1
        atom: O1
        z: 1
      B:
        reactant: 1
        resid: 1
        atom: C1
        z: 1
    bonds:
      - atoms: [A, B]
        order: 1
