# htpolynet configuration schema, for ycleptic.
#
# STATUS: not yet wired into htpolynet.  This file is inert data until
# `ycleptic` can be declared as a runtime dependency, which is blocked on
# ycleptic reaching conda-forge (htpolynet is on conda-forge and a conda
# package's run-deps must exist in the channel).  See ROADMAP.md.
#
# REQUIRES ycleptic >= 2.4.0, for `value_attributes`/`key_text` (free-key
# mappings), `value_type` (scalar-valued free-key mappings) and `list_defaults`
# (per-attribute replace semantics).  2.4.0 is released on PyPI, but the pin
# must NOT be written into pyproject.toml until the anaconda API says 2.4.0 is
# on the conda-forge CHANNEL -- as of this writing ycleptic is not on
# conda-forge at all.  See ROADMAP.md for why.
#
# `constituents` is a free-key mapping: its keys are molecule names the user
# invents, and `value_attributes` gives the schema every record must satisfy.
# Every list whose real default is non-empty carries `list_defaults: replace`,
# because ycleptic's default is `append` -- correct for pestifer's CHARMM file
# lists, wrong for an MD ladder, where a base default of [min, nvt, npt] plus a
# user's [nvt] would otherwise yield ['min','nvt','npt','nvt'] and run the
# user's own step last and twice, silently.
#
# Every section is now validated.  `value_attributes` on a LIST closed the last
# gap: htpolynet's reaction and repair records are multi-key dicts, which the
# older tagged-task idiom (`itemname = list(item.keys())[0]`) could not
# describe, so `reactions` and `postcure_repair` had to be bare lists.  They
# are not any more, and errors name the offending item -- `under
# 'reactions[3]'`.
#
# The one thing left unconstrained on purpose: `gromacs.mdrun_options` accepts
# arbitrary mdrun flags, which is what it is for.
#
# `required: true` binds on every attribute here, including the list ones --
# `reactions[].bonds`, `bonds[].atoms`, and the repair spec's
# `ring_carbon_atoms`, `ring_nitrogen_atoms` and `reactive_oxygen_atoms`.
# That was NOT true in ycleptic 2.4.0, where an omitted required list was
# quietly filled with `[]`: the declarations were inert and a config missing one
# validated, then failed deeper in htpolynet.  Found here by a negative test
# that passed when it should have failed, reported, and fixed in **2.4.1** --
# which is why the pin in pyproject.toml is >=2.4.1 and not >=2.4.0.

docs:
  title: htpolynet run configuration
  text: >
    Everything htpolynet needs to build a polymerized system, from monomer
    structures through the polymerization chemistry.  Sections may appear in
    any order.

attributes:

  - name: Title
    type: str
    text: A descriptive title for the build; appears in logs and reports.
    default: No title provided

  - name: ncpu
    type: int
    text: >
      Worker processes for the parallelized bond search.  Defaults to the
      machine's CPU count.

  - name: gromacs
    type: dict
    text: >
      How htpolynet invokes GROMACS.  Optional; the defaults work on a plain
      Linux workstation.  On a cluster with a native GROMACS, point `gmx` at
      the full path to `gmx_mpi` (or load the module) and use `mdrun` to
      supply the mpirun/mpiexec launch syntax.
    attributes:
      - name: gmx
        type: str
        text: The gmx command.
        default: gmx
      - name: gmx_options
        type: str
        text: Options passed to every gmx call.
        default: -quiet -nobackup
      - name: mdrun
        type: str
        text: The mdrun command.
        default: gmx mdrun
      - name: mdrun_single_molecule
        type: str
        text: >
          An mdrun variant used for single-molecule runs (parameterization and
          conformer generation).  Best run on one processor with no domain
          decomposition.
      - name: mdrun_options
        type: dict            # FREE-KEY: arbitrary mdrun command-line flags
        text: >
          Command-line arguments passed to mdrun, as keyword/value pairs.
          `gpu_id` is stripped at runtime if the gmx build cannot drive a GPU
          or none is visible.
        default: {}

  - name: ambertools
    type: dict
    text: >
      How htpolynet invokes the AmberTools suite.  These three directives
      determine what antechamber produces, so each parameterization records
      them in a `.parm` file checked into the molecule library; a run whose
      directives disagree with the record re-parameterizes rather than
      reusing the cached files.
    attributes:
      - name: charge_method
        type: str
        text: Charge model used by antechamber.  Any antechamber-compatible method.
        default: gas
      - name: net_charge
        type: int
        text: Formal charge of each molecule, passed to `antechamber -nc`.
        default: 0
      - name: atom_type
        type: str
        text: Atom-type set used by antechamber, parmchk2 and tleap.
        default: gaff

  - name: GAFF
    type: dict
    text: >
      Resolution of internally inconsistent GAFF atom types and parameters.
      AmberTools occasionally emits types that parmed cannot translate into a
      GROMACS topology, or that conflict between two topologies being merged.
    attributes:
      - name: resolve_type_discrepancies
        type: list            # empty default; append and replace are identical here
        text: >
          Records describing how to resolve conflicting interaction types.
          Each record carries `typename` (the interaction type in the top
          file, e.g. dihedraltypes), `funcidx` (its function index), and
          `rule` (currently only `stiffest`, which keeps the conflicting type
          with the largest energetic parameters).

  - name: resolve_type_discrepancies
    type: list                # empty default; append and replace are identical here
    text: >
      Deprecated top-level spelling of `GAFF.resolve_type_discrepancies`.
      Both are read (core/runtime.py:326), with the GAFF-scoped one winning.
      Declared here only so existing configs keep validating; prefer the
      GAFF-scoped form.

  - name: constituents
    type: dict
    text: >
      The initial make-up of the system, as one record per molecule keyed by
      the molecule's name.  The key tells htpolynet to look for NAME.mol2 or
      NAME.pdb in lib/molecules/inputs, or an existing parameterization in
      lib/molecules/parameterized; failing both, a `smiles` key lets it
      generate the input itself.
    key_text: >
      A molecule name, e.g. STY, BPA or GMA.  It is the library key for every
      file this molecule owns.
    value_attributes:
      - name: count
        type: int
        text: >
          How many of these go in the box.  0 or missing marks an
          intermediate -- a species that exists only to be built into another,
          for which stereocenters or symmetry-equivalent atoms are declared.
        default: 0
      - name: smiles
        type: str
        text: >
          SMILES for in-config monomer generation.  htpolynet runs obabel, or
          RDKit when the string uses `[*:N]` atom-mapping tokens, to
          materialize lib/molecules/inputs/NAME.mol2 before parameterization.
      - name: reactive_atoms
        type: dict
        value_type: str
        required: false       # PRESENCE IS MEANINGFUL
        key_text: A SMILES atom-map label, i.e. the N in a `[*:N]` token.
        text: >
          Map from a SMILES atom-map label to an atom name, for the RDKit
          path; pairs with a `smiles` that uses `[*:N]` tokens.  Declared
          `required: false` because `external/smiles_input.py:60` selects the
          RDKit path on this key being *present*; an injected empty map would
          take that path with nothing in it.
      - name: rename_atoms
        type: dict
        value_type: str
        required: false       # PRESENCE IS MEANINGFUL
        key_text: A 1-based atom index into the mol2 obabel wrote.
        text: >
          Map from 1-based mol2 index to atom name, applied after obabel
          writes the mol2; pairs with a `smiles` on the obabel path.  Declared
          `required: false` because `external/smiles_input.py:66` raises a
          helpful error when it is absent; an injected empty map would bypass
          that and silently produce wrongly-named atoms.
      - name: stereocenters
        type: list
        text: Names of this molecule's chiral carbons, if any.
      - name: symmetry_equivalent_atoms
        type: list
        text: Sets of symmetry-equivalent atom names, if any.
      - name: frcmod
        type: str
        required: false
        text: >
          Path, relative to the configuration file, to an Amber frcmod file of
          parameter overrides for this molecule.  tleap loads it after GAFF and
          parmchk2, so its entries win.  It is loaded for this molecule and for
          every template containing it, and it is part of each parameterization's
          cache record, so editing the file re-parameterizes them.  A system
          keeps one table per bonded type, so an overridden type must not also
          occur, unoverridden, in a molecule without this residue; setup stops if
          it does.
      - name: conformers
        type: dict
        required: false
        text: >
          Whether and how to generate multiple conformers of a flexible
          molecule for building the initial liquid.  Omit it and the conformer
          used is whichever one the input mol2 or the constructed gro holds.
        attributes:
          - name: count
            type: int
            text: Number of unique conformers to generate, per stereoisomer.
            required: true
          - name: generator
            type: dict
            required: false
            text: How the conformers are generated.
            attributes:
              - name: name
                type: str
                text: obabel, or gromacs for a short vacuum MD.
                choices: [obabel, gromacs]
                required: true
              - name: params
                type: dict
                required: false
                text: >
                  Parameters for the generator; only meaningful for the
                  gromacs generator.
                attributes:
                  - name: ensemble
                    type: str
                    text: nvt is the only choice that makes sense in vacuum.
                    choices: [min, nvt, npt]
                    default: nvt
                  - name: temperature
                    type: float
                    text: Temperature in K of the conformer-generating MD.
                  - name: ps
                    type: float
                    text: Duration in picoseconds of the conformer-generating MD.
                  - name: pad
                    type: float
                    text: Box-size padding in nm for the vacuum MD.

  - name: densification
    type: dict
    text: >
      The initial densification of the fresh system.  Specify exactly one of
      `initial_density` or `initial_boxsize`; supplying both, or neither, is
      an error.
    attributes:
      - name: initial_density
        type: float
        text: >
          Density in kg/m^3 at which molecules are placed randomly into the
          box to make the initial coordinates.
        default: 200.0
      - name: initial_boxsize
        type: list
        required: false       # PRESENCE IS MEANINGFUL -- see below
        text: >
          Explicit initial box dimensions in nm, as an alternative to
          `initial_density`.  Declared `required: false` so ycleptic omits it
          entirely when the user does: `core/runtime.py:955` asserts that
          exactly one of this and `initial_density` is *present*, so an
          injected empty list would fail that assertion on every build.
      - name: aspect_ratio
        type: list
        list_defaults: replace
        default: [1.0, 1.0, 1.0]
        text: Relative box dimensions used when sizing the box from a density.
      - name: scale
        type: float
        text: Packing scale factor passed to `gmx insert-molecules`.
        default: 0.4
      - name: equilibration
        type: list
        list_defaults: replace
        default:
          - ensemble: min
          - ensemble: nvt
            temperature: 300
            ps: 10
          - ensemble: npt
            temperature: 300
            pressure: 10
            ps: 200
        text: >
          An ordered list of MD records run to densify the box.  `repeat`
          matters for very low initial densities: several short NPT runs beat
          one long one, because a large box shrinkage in a single run
          overwhelms domain decomposition.
        value_attributes:
          - name: ensemble
            type: str
            required: true
            choices: [min, nvt, npt]
            text: min (minimization), nvt, or npt.
          - name: temperature
            type: float
            text: Temperature in K, assigned to `ref_t`.  Required for nvt and npt.
          - name: pressure
            type: float
            text: Pressure in bar, assigned to `ref_p`.  Required for npt.
          - name: nsteps
            type: int
            text: Duration in timesteps.  Supply this or `ps`.
          - name: ps
            type: float
            text: Duration in picoseconds.  Supply this or `nsteps`.
          - name: repeat
            type: int
            text: Times to repeat this simulation in series; 0 runs it once.
            default: 0
          - name: converge
            type: dict
            required: false
            text: >
              Keep repeating this stage until its density settles, instead of
              running a fixed number of steps somebody guessed.  npt only, and
              off unless configured, so existing results stay reproducible.
              Densification is the right place for this: the 200 -> ~1100
              kg/m^3 compaction happens once and involves a large volume
              change.  The criterion is an autocorrelation-corrected standard
              error -- NPT density is correlated over hundreds of steps, so a
              naive SEM is optimistic and would stop early -- plus a test that
              the trace is not still drifting.  A build that never settles
              says so rather than quietly reporting the density it reached.
              Note each extension regenerates velocities, exactly as `repeat`
              does, so the criterion is applied to the last segment.
            attributes:
              - name: tolerance
                type: float
                text: >
                  Largest acceptable standard error of the mean density, in
                  kg/m^3.
                default: 1.0
              - name: max_repeats
                type: int
                text: >
                  Ceiling on extension segments.  Reaching it is reported as a
                  failure to converge, not as success.
                default: 10
              - name: min_samples
                type: int
                text: >
                  Refuse to judge a window with fewer energy frames than this.
                default: 50
              - name: drift_sems
                type: float
                text: >
                  How far the window's two halves may differ, in units of that
                  difference's own standard error.
                default: 2.0

  - name: precure
    type: dict
    text: MD run after densification and before the cure.
    attributes:
      - name: preequilibration
        type: dict
        text: An MD simulation run before the anneal.
        attributes:
          - name: ensemble
            type: str
            text: min (minimization), nvt, or npt.
            choices: [min, nvt, npt]
            default: npt
          - name: temperature
            type: float
            text: Temperature in K, assigned to `ref_t`.
            default: 300
          - name: pressure
            type: float
            text: Pressure in bar, assigned to `ref_p`.
            default: 1
          - name: ps
            type: float
            text: Duration in picoseconds.  Supply this or `nsteps`.
            default: 100
          - name: nsteps
            type: int
            text: Duration in timesteps.  Supply this or `ps`.
          - name: repeat
            type: int
            text: Times to repeat this simulation in series; 0 runs it once.
            default: 0
      - name: anneal
        type: dict
        text: An annealing simulation run after the optional preequilibration.
        attributes:
          - name: ncycles
            type: int
            text: Number of annealing cycles; 0 skips the anneal.
            default: 0
          - name: initial_temperature
            type: float
            text: Initial temperature in K.  Sets only the `gen-temp` mdp parameter.
            default: 300
          - name: cycle_segments
            type: list
            list_defaults: replace
            default:
              - {T: 300, ps: 0}
              - {T: 600, ps: 20}
              - {T: 600, ps: 20}
              - {T: 300, ps: 20}
              - {T: 300, ps: 20}
            text: >
              The annealing points of one cycle, in order.  Each record takes
              `T` (target temperature in K) and `ps` (duration).  If the
              previous segment's `T` differs, the system is brought to this
              `T` over that time; if it is the same, the system is held there.
      - name: postequilibration
        type: dict
        text: An MD simulation run after the anneal.
        attributes:
          - name: ensemble
            type: str
            text: min (minimization), nvt, or npt.
            choices: [min, nvt, npt]
            default: npt
          - name: temperature
            type: float
            text: Temperature in K, assigned to `ref_t`.
            default: 300
          - name: pressure
            type: float
            text: Pressure in bar, assigned to `ref_p`.
            default: 1
          - name: ps
            type: float
            text: Duration in picoseconds.  Defaults to 0, i.e. skipped.
            default: 0
          - name: nsteps
            type: int
            text: Duration in timesteps.  Supply this or `ps`.
          - name: repeat
            type: int
            text: Times to repeat this simulation in series; 0 runs it once.
            default: 0

  - name: CURE
    type: dict
    text: >
      Everything governing the CURE algorithm: the bond search, the optional
      dragging of distant partners, the relaxation of newly formed bonds, and
      the per-iteration equilibration.
    attributes:

      - name: controls
        type: dict
        text: How the bond search runs and when the cure stops.
        attributes:
          - name: search_radius
            type: float
            text: Initial bond-search radius in nm.
            default: 0.5
          - name: radial_increment
            type: float
            text: >
              Increment in nm by which the search radius grows when not enough
              bonds are found at the current radius.
            default: 0.05
          - name: min_bonds_per_iteration
            type: int
            text: >
              Grow the radius until at least this many bonds are found, then
              proceed with whatever the count is.  Clamped against the bonds
              still needed to reach `desired_conversion` and against
              `max_conversion_per_iteration`, so a large value never stalls a
              build.  1 reproduces the un-batched legacy behavior.
            default: 10
          - name: max_iterations
            type: int
            text: Absolute maximum number of cure iterations.
            default: 100
          - name: desired_conversion
            type: float
            text: >
              Target BOND conversion -- bonds formed over bonds possible.  This
              is not the crosslinker conversion an experiment measures, which
              is lower.  Note the default is a half-cure; every shipped example
              that cures sets this explicitly.
            default: 0.5
          - name: late_threshold
            type: float
            text: Conversion above which per-reaction bond probabilities are ignored.
            default: 0.85
          - name: max_conversion_per_iteration
            type: float
            text: >
              Upper limit, as a fraction of total reactable bonds, on the new
              bonds formed in any single iteration.  1.0 is no cap.
            default: 1.0
          - name: min_allowable_bondcycle_length
            type: int
            text: >
              Minimum number of carbons allowed in a cycle of C-C bonds formed
              by polymerization.  Any value <= 0 disallows all such cycles.
            default: -1
          - name: completion_bias
            type: bool
            text: >
              Rank bond candidates by how many bonds their B-side residue
              already carries, and only then by distance, so partly-reacted
              crosslinkers are completed before untouched ones are started.
              Changes which bonds form, and with them what `desired_conversion`
              means physically, so comparisons across this setting must be made
              at matched crosslinker conversion.
            default: false
          - name: ncpu
            type: int
            text: Worker processes for the bond search.  Defaults to the CPU count.

      - name: drag
        type: dict
        text: >
          Dragging: MD stages in which type-6 harmonic restraints pull each
          to-be-bonded pair together BEFORE the bond forms, which reduces the
          1-4 distances that otherwise arise when it does.  The restraint's
          `b0` is decreased linearly across the stages.
        attributes:
          - name: trigger_distance
            type: float
            text: >
              Pair separation in nm above which dragging is performed at all.
              0.0 disables dragging.
            default: 0.0
          - name: limit
            type: float
            text: Distance in nm to which pairs are dragged.
            default: 0.0
          - name: increment
            type: float
            text: >
              Minimum amount in nm by which the target distance is decreased
              per stage; with `limit`, this sets the stage count.
            default: 0.0
          - name: nstages
            type: int
            text: Explicit stage count, as an alternative to deriving one from `increment`.
            default: 0
          - name: kb
            type: float
            text: Spring constant of the restraint, in kJ/mol/nm.
            default: 300000.0
          - name: cutoff_pad
            type: float
            text: Padding in nm added to the nonbonded cutoffs during dragging.
            default: 0.2
          - name: equilibration
            type: list
            list_defaults: replace
            default:
              - ensemble: min
              - ensemble: nvt
                temperature: 600
                nsteps: 1000
              - ensemble: npt
                temperature: 600
                pressure: 1
                nsteps: 2000
            text: >
              The MD records run at each drag stage.  Runs unconstrained at a
              1 fs timestep, because the bonds being manipulated are
              deliberately far from equilibrium.  These stages deliberately
              offer no `converge` block: gating the cure loop on density was
              measured and rejected, because past the gel point no amount of
              NPT time restores reactive-species mobility.
            value_attributes: &cure_md_record
              - name: ensemble
                type: str
                required: true
                choices: [min, nvt, npt]
                text: min (minimization), nvt, or npt.
              - name: temperature
                type: float
                text: Temperature in K, assigned to `ref_t`.
              - name: pressure
                type: float
                text: Pressure in bar, assigned to `ref_p`.
              - name: nsteps
                type: int
                text: Duration in timesteps.
              - name: ps
                type: float
                text: Duration in picoseconds.  Supply this or `nsteps`.
              - name: repeat
                type: int
                text: Times to repeat this simulation in series; 0 runs it once.
                default: 0

      - name: relax
        type: dict
        text: >
          Relaxation: MD stages in which each new bond's `kb` and `b0` are
          attenuated from a weak, long state to the values the force field
          dictates.
        attributes:
          - name: increment
            type: float
            text: >
              Minimum amount in nm by which `b0` is decreased per stage; this
              sets the stage count.  Not 0.0: `_distance_attenuation` divides
              by it with no guard.
            default: 0.08
          - name: nstages
            type: int
            text: Explicit stage count, as an alternative to deriving one from `increment`.
            default: 6
          - name: cutoff_pad
            type: float
            text: Padding in nm added to the nonbonded cutoffs during relaxation.
            default: 0.2
          - name: equilibration
            type: list
            list_defaults: replace
            default:
              - ensemble: min
              - ensemble: nvt
                temperature: 600
                nsteps: 1000
              - ensemble: npt
                temperature: 600
                pressure: 1
                nsteps: 2000
            text: >
              The MD records run at each relax stage.  Runs unconstrained at
              a 1 fs timestep.  These stages are the only above-Tg
              constant-pressure time in a cure, and as of v2.7.0 each reports
              the density it produces.
            value_attributes: *cure_md_record

      - name: equilibrate
        type: dict
        text: >
          The equilibration run at the end of every cure iteration.  Unlike
          drag and relax this uses a 2 fs timestep with constraints; see the
          program-flow documentation.
        attributes:
          - name: ensemble
            type: str
            text: min (minimization), nvt, or npt.
            choices: [min, nvt, npt]
            default: npt
          - name: temperature
            type: float
            text: Temperature in K.
            default: 300
          - name: pressure
            type: float
            text: Pressure in bar.
            default: 1
          - name: nsteps
            type: int
            text: Duration in timesteps.
            default: 50000
          - name: ps
            type: float
            text: Duration in picoseconds.  Supply this or `nsteps`.
          - name: repeat
            type: int
            text: Times to repeat this simulation in series; 0 runs it once.
            default: 0

      - name: gromacs
        type: dict
        text: >
          mdp adjustments applied to every drag and relax simulation.
          htpolynet shortens the nonbonded cutoffs to match the longest
          unrelaxed bond; `rdefault` is the floor it will not go below.
        attributes:
          - name: rdefault
            type: float
            text: Minimum cutoff radius in nm.
            default: 0.9

      - name: output
        type: dict
        text: Where the cure writes its per-iteration bond records.
        attributes:
          - name: bonds_file
            type: str
            text: CSV of every bond formed, accumulated across iterations.
            default: bonds.csv

  - name: postcure
    type: dict
    text: >
      MD run after the cure.  Identical in form to `precure`.  Note that the
      density at the end of `postequilibration` is NOT an equilibrated density
      and should not be quoted as one -- a crosslinked network relaxes only
      above its glass transition.  Extract densities from a melt-and-slow-cool
      postsim ladder instead.
    attributes:
      - name: preequilibration
        type: dict
        text: An MD simulation run before the anneal.
        attributes:
          - name: ensemble
            type: str
            text: min (minimization), nvt, or npt.
            choices: [min, nvt, npt]
            default: npt
          - name: temperature
            type: float
            text: Temperature in K.
            default: 300
          - name: pressure
            type: float
            text: Pressure in bar.
            default: 1
          - name: ps
            type: float
            text: Duration in picoseconds.  Defaults to 0, i.e. skipped.
            default: 0
          - name: nsteps
            type: int
            text: Duration in timesteps.  Supply this or `ps`.
          - name: repeat
            type: int
            text: Times to repeat this simulation in series; 0 runs it once.
            default: 0
      - name: anneal
        type: dict
        text: An annealing simulation run after the cure.
        attributes:
          - name: ncycles
            type: int
            text: Number of annealing cycles; 0 skips the anneal.
            default: 0
          - name: initial_temperature
            type: float
            text: Initial temperature in K.  Sets only the `gen-temp` mdp parameter.
            default: 300
          - name: cycle_segments
            type: list
            list_defaults: replace
            default:
              - {T: 300, ps: 0}
              - {T: 600, ps: 20}
              - {T: 600, ps: 20}
              - {T: 300, ps: 20}
              - {T: 300, ps: 20}
            text: >
              The annealing points of one cycle, in order; each record takes
              `T` and `ps`.
      - name: postequilibration
        type: dict
        text: An MD simulation run after the anneal.
        attributes:
          - name: ensemble
            type: str
            text: min (minimization), nvt, or npt.
            choices: [min, nvt, npt]
            default: npt
          - name: temperature
            type: float
            text: Temperature in K.
            default: 300
          - name: pressure
            type: float
            text: Pressure in bar.
            default: 1
          - name: ps
            type: float
            text: Duration in picoseconds.  Defaults to 0, i.e. skipped.
            default: 0
          - name: nsteps
            type: int
            text: Duration in timesteps.  Supply this or `ps`.
          - name: repeat
            type: int
            text: Times to repeat this simulation in series; 0 runs it once.
            default: 0

  - name: postcure_repair
    type: list
    text: >
      Topology repairs applied after the cure, in order.
    value_attributes:
      - name: type
        type: str
        required: true
        text: >
          Which repair to run.  `triazine_to_cyanate_cap` dismantles
          crosslinkers that did not fill all their sites into -C#N caps:
          fragments already attached to a bridge become caps in place, and the
          rest are transferred to the nearest unreacted bridge.
        choices: [triazine_to_cyanate_cap]
      - name: crosslinker
        type: dict
        required: true
        text: The crosslinker residue being dismantled.
        attributes:
          - name: residue
            type: str
            required: true
            text: Residue name of the crosslinker, e.g. TAZ.
          - name: ring_carbon_atoms
            type: list
            required: true
            text: Names of the ring carbons, one per potential bond.
          - name: ring_nitrogen_atoms
            type: list
            required: true
            text: Names of the ring nitrogens, one per potential bond.
          - name: full_bond_count
            type: int
            text: How many bonds a complete crosslinker carries.
            default: 3
      - name: bridge
        type: dict
        required: true
        text: The bifunctional residue the crosslinker bonds to.
        attributes:
          - name: residue
            type: str
            required: true
            text: Residue name of the bridge, e.g. BPA.
          - name: reactive_oxygen_atoms
            type: list
            required: true
            text: Names of the bridge's reactive oxygens.
      - name: cap_residue
        type: str
        required: true
        text: Residue name given to the -C#N cap, e.g. CYN.
      - name: cap_template
        type: str
        required: true
        text: >
          Name of the linked-product template supplying post-repair
          parameters, e.g. `BPA~O1-C1~CYN`; symmetry siblings are auto-tried.
      - name: cap_search_radius
        type: float
        text: >
          Radius in nm within which a transferred fragment looks for an
          unreacted bridge.  Expanded up to 10x on a miss, then falls back to
          the global nearest.
        default: 0.6
      - name: cap_min_clearance
        type: float
        text: >
          Target clearance in nm for a placed cap; placements below it are
          counted and reported rather than rejected.
        default: 0.15

  - name: reactions
    type: list
    text: >
      Every reaction needed to build the constituents and to cure the system.
      Today an unrecognized key here is discarded with a debug-level message
      from `Reaction.__init__`, so a typo is effectively silent.
    value_attributes:
      - name: name
        type: str
        required: true
        text: A label for this reaction; appears in logs and product names.
      - name: stage
        type: str
        required: true
        text: >
          When this reaction is used.  `build` uses parameterized oligomers to
          build molecules; `param` generates parameterized oligomers that are
          not cure reactions; `cure` generates those that are; `cap` makes
          capped monomers; `repair` supplies templates for postcure topology
          repair.
        choices: [build, param, cure, cap, repair]
      - name: reactants
        type: dict
        value_type: str
        required: true
        key_text: >
          A reactant index, referenced by `reactant` in this reaction's atom
          records.
        text: Map from reactant index to molecule name.
      - name: product
        type: str
        required: true
        text: Name given to the molecule this reaction produces.
      - name: atoms
        type: dict
        required: true
        key_text: >
          An atom label, A, B, ..., referenced by this reaction's bond
          records.
        text: The atoms this reaction joins.
        value_attributes:
          - name: reactant
            type: int
            required: true
            text: Which reactant index this atom belongs to.
          - name: resid
            type: int
            required: true
            text: Residue number within that reactant.
          - name: atom
            type: str
            required: true
            text: Atom name within that residue.
          - name: z
            type: int
            required: true
            text: >
              Reactive valence this atom must still have for the reaction to
              apply.
      - name: bonds
        type: list
        required: true
        text: The bonds this reaction forms.
        value_attributes:
          - name: atoms
            type: list
            required: true
            text: The two atom labels to join, e.g. [A, B].
          - name: order
            type: int
            text: Bond order.
            default: 1
          - name: sacrificial_h
            type: bool
            text: >
              Whether forming this bond consumes one hydrogen from each of its
              atoms, as a condensation does.  Set false for an addition, where
              nothing is lost: cyclotrimerization of three -O-C#N groups into a
              triazine ring forms three bonds and deletes no atom.
            default: true
      - name: probability
        type: float
        text: >
          Probability with which an identified bond of this type is accepted,
          below `CURE.controls.late_threshold` conversion.
        default: 1.0
      - name: procession
        type: dict
        required: false
        text: >
          Linear polymerization: derive a series of further reactions by
          repeatedly incrementing the residue index.
        attributes:
          - name: count
            type: int
            required: true
            text: How many further reactions to derive.
          - name: increment_resid
            type: int
            text: Residue-index step between successive derived reactions.
            default: 1
